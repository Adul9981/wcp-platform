<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界杯每日预测 · 2026</title>
<style>
:root{
  --bg:#f5f7fa;--card:#fff;--border:#e2e8f0;--txt:#0f172a;
  --muted:#64748b;--green:#16a34a;--blue:#2563eb;--gold:#d97706;
  --red:#dc2626;--shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;font-size:15px}

/* ── Header ── */
header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;box-shadow:var(--shadow)}
.hinner{max-width:780px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.logo{font-size:17px;font-weight:800;letter-spacing:-.3px}
.logo span{color:var(--green)}
.hlinks{display:flex;gap:6px;flex-wrap:wrap}
.hl{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:20px;text-decoration:none;font-size:12px;font-weight:600;white-space:nowrap;transition:.15s}
.hl-tg{background:#229ED9;color:#fff}.hl-tg:hover{background:#1a8fc2}
.hl-qq{background:#12B7F5;color:#fff}.hl-qq:hover{background:#0da0d8}
.hl-pm{background:var(--blue);color:#fff}.hl-pm:hover{background:#1d4ed8}

/* ── Stats bar ── */
.stats{background:var(--green);color:#fff}
.stats-inner{max-width:780px;margin:0 auto;padding:10px 16px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.stat{display:flex;flex-direction:column;align-items:center}
.stat-val{font-size:20px;font-weight:800;line-height:1}
.stat-lbl{font-size:11px;opacity:.8;margin-top:2px}
.stat-sep{width:1px;background:rgba(255,255,255,.3);height:32px}

/* ── Wrap ── */
.wrap{max-width:780px;margin:0 auto;padding:20px 16px}

/* ── Today prediction (hero) ── */
.today-section{margin-bottom:24px}
.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.pred-post{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.pred-post-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.pred-day{font-size:17px;font-weight:800}
.pred-ts{font-size:11px;color:var(--muted)}
.pred-content{font-size:14px;color:#1e293b;line-height:1.9;white-space:pre-wrap}
.pred-content p{margin:2px 0}
.pred-content .lbl{font-weight:700;color:var(--txt)}
.pred-content ul{margin:4px 0 4px 18px}
.pred-content li{margin:1px 0}
.result-sep{margin:16px 0;border:none;border-top:2px dashed #e2e8f0}
.result-block{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:14px;font-size:14px;line-height:1.9;white-space:pre-wrap;color:#14532d}
.result-block p{margin:2px 0}
.no-pred{background:#fff;border:1px solid var(--border);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted)}
.no-pred .icon{font-size:36px;margin-bottom:10px}
.no-pred p{font-size:14px}

/* ── Community CTA ── */
.cta-section{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:24px;text-align:center}
.cta-title{font-size:15px;font-weight:700;margin-bottom:6px}
.cta-sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.cta-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cta-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:24px;text-decoration:none;font-size:13px;font-weight:700;transition:.15s}
.cta-tg{background:#229ED9;color:#fff}.cta-tg:hover{background:#1a8fc2}
.cta-qq{background:#12B7F5;color:#fff}.cta-qq:hover{background:#0da0d8}
.cta-pm{border:1.5px solid var(--blue);color:var(--blue);background:#fff}.cta-pm:hover{background:var(--blue);color:#fff}
.invite{font-size:12px;color:var(--muted);margin-top:10px}
.invite b{color:var(--gold)}

/* ── History ── */
.history-section{}
.history-item{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.history-hd{display:flex;align-items:center;padding:12px 16px;cursor:pointer;gap:10px;user-select:none}
.history-hd:hover{background:#f8fafc}
.history-day{font-size:14px;font-weight:700;flex:1}
.history-meta{display:flex;gap:8px;font-size:12px;align-items:center;flex-wrap:wrap}
.hm-hit{color:var(--green);font-weight:700}
.hm-miss{color:var(--red)}
.hm-total{color:var(--muted)}
.chevron{color:var(--muted);transition:.2s;font-size:12px}
.history-body{border-top:1px solid var(--border);padding:16px;display:none;font-size:13px;line-height:1.9;white-space:pre-wrap;color:#334155}
.history-body p{margin:2px 0}
.history-body.open{display:block}
.history-result{background:#f0fdf4;border-radius:8px;padding:12px;margin-top:12px;font-size:13px;line-height:1.9;white-space:pre-wrap;color:#14532d}
.history-result p{margin:2px 0}

.loading{text-align:center;color:var(--muted);padding:40px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:30px;font-size:13px}
footer{padding:20px 16px;color:var(--muted);font-size:12px;text-align:center;border-top:1px solid var(--border);margin-top:8px;line-height:1.8}
</style>
</head>
<body>

<header>
  <div class="hinner">
    <div class="logo">⚽ 世界杯<span>每日预测</span></div>
    <div class="hlinks" id="hlinks">
      <a class="hl hl-tg" href="#" id="hTg" target="_blank">✈ Telegram</a>
      <a class="hl hl-qq" href="#" id="hQq" target="_blank">💬 QQ群</a>
      <a class="hl hl-pm" href="https://polymarket.com/?r=adul" target="_blank" rel="noopener">🔗 Polymarket</a>
    </div>
  </div>
</header>

<div class="stats">
  <div class="stats-inner">
    <div class="stat"><div class="stat-val" id="sRate">--%</div><div class="stat-lbl">主推命中率</div></div>
    <div class="stat-sep"></div>
    <div class="stat"><div class="stat-val" id="sTotal">--</div><div class="stat-lbl">已预测场次</div></div>
    <div class="stat-sep"></div>
    <div class="stat"><div class="stat-val" id="sDay">--</div><div class="stat-lbl">世界杯进行中</div></div>
  </div>
</div>

<div class="wrap">

  <!-- 今日预测 -->
  <div class="today-section">
    <div class="section-title">今日预测方案</div>
    <div id="todayPred"><div class="loading">加载中…</div></div>
  </div>

  <!-- 社群入口 -->
  <div class="cta-section">
    <div class="cta-title">加入社群，第一时间获取每日预测</div>
    <div class="cta-sub">预测方案每天赛前自动更新，加群即可实时收到</div>
    <div class="cta-btns">
      <a class="cta-btn cta-tg" href="#" id="ctaTg" target="_blank">✈ 加入 Telegram 群</a>
      <a class="cta-btn cta-qq" href="#" id="ctaQq" target="_blank">💬 加入 QQ 群</a>
      <a class="cta-btn cta-pm" href="https://polymarket.com/?r=adul" target="_blank" rel="noopener">🔗 注册 Polymarket</a>
    </div>
    <div class="invite">Polymarket 邀请码：<b>adul</b>（注册时填入）</div>
  </div>

  <!-- 历史记录 -->
  <div class="history-section">
    <div class="section-title">历史预测记录</div>
    <div id="historyList"><div class="loading">加载中…</div></div>
  </div>

</div>

<footer>
  本站预测由 AI 辅助生成，仅供参考，不构成投资建议。<br>
  所有投注请在 Polymarket 自行完成，风险自担。<br>
  <a href="/admin" style="color:var(--muted)">后台管理</a>
</footer>

<script>
const WC_START = new Date("2026-06-11T00:00:00Z");

function dayNum(){
  const d = Math.floor((Date.now() - WC_START.getTime()) / 86400000) + 1;
  return Math.max(1, d);
}

function fmtTime(s){
  if(!s) return "";
  return new Date(s).toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
}

function formatContent(text, cls="pred-content"){
  if(!text) return "";
  const esc = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const lines = esc.split("\n");
  let html = `<div class="${cls}">`, inList = false;
  for(const raw of lines){
    const line = raw.trim();
    if(!line){ if(inList){html+="</ul>";inList=false;} html+="<p>&nbsp;</p>"; continue; }
    if(line.startsWith("* ")||line.startsWith("• ")){
      if(!inList){html+="<ul>";inList=true;}
      html+=`<li>${line.slice(2)}</li>`;
    } else {
      if(inList){html+="</ul>";inList=false;}
      const isLabel = /[：:：]$/.test(line) || /^Day\d+/.test(line) || /^\d+\.\s/.test(line);
      html+=`<p class="${isLabel?"lbl":""}">${line}</p>`;
    }
  }
  if(inList) html+="</ul>";
  html+="</div>";
  return html;
}

function countResults(text){
  if(!text) return {hits:0, miss:0};
  const hits = (text.match(/✅/g)||[]).length;
  const miss = (text.match(/0️⃣/g)||[]).length;
  return {hits, miss};
}

// ── 配置（社群链接）──
async function loadConfig(){
  try{
    const cfg = await (await fetch("/config")).json();
    if(cfg.tg_link){
      document.getElementById("hTg").href = cfg.tg_link;
      document.getElementById("ctaTg").href = cfg.tg_link;
    }
    if(cfg.qq_link){
      document.getElementById("hQq").href = cfg.qq_link;
      document.getElementById("ctaQq").href = cfg.qq_link;
    }
  }catch(e){}
}

// ── 今日预测 ──
async function loadToday(){
  const box = document.getElementById("todayPred");
  try{
    const d = await (await fetch("/predictions")).json();
    const preds = d.predictions || [];
    if(!preds.length){
      box.innerHTML=`<div class="no-pred"><div class="icon">🕐</div><p>今日预测方案即将发布<br><span style="font-size:12px;color:var(--muted)">每天赛前自动生成</span></p></div>`;
      return;
    }
    // 最新的一条（自动生成优先）
    const auto = preds.find(p=>p.is_auto===1||p.is_auto===true);
    const p = auto || preds[0];
    const hasResult = p.result_text && p.result_text.trim();
    box.innerHTML=`<div class="pred-post">
      <div class="pred-post-head">
        <div class="pred-day">${p.match_name||"今日预测"}</div>
        <div class="pred-ts">更新于 ${fmtTime(p.updated_ts||p.created_ts)}</div>
      </div>
      ${formatContent(p.content)}
      ${hasResult?`<div class="result-sep"></div>${formatContent(p.result_text,"result-block")}`:""}
    </div>`;
  }catch(e){
    box.innerHTML=`<div class="no-pred"><div class="icon">⚠️</div><p>加载失败，请刷新重试</p></div>`;
  }
}

// ── 历史记录 ──
async function loadHistory(){
  const box = document.getElementById("historyList");
  try{
    const d = await (await fetch("/history?per_page=30")).json();
    const items = d.items || [];
    if(!items.length){
      box.innerHTML=`<div class="empty">历史记录将在这里显示</div>`;
      return;
    }
    box.innerHTML = items.map((p,i)=>{
      const hasResult = p.result_text && p.result_text.trim();
      const {hits, miss} = countResults(p.result_text||"");
      const metaHtml = hasResult
        ? `<span class="hm-hit">✅ ${hits}中</span><span class="hm-miss">0️⃣ ${miss}未中</span>`
        : `<span class="hm-total">待更新</span>`;
      return`<div class="history-item">
        <div class="history-hd" onclick="toggleHistory(this)">
          <div class="history-day">${p.match_name||"预测记录"}</div>
          <div class="history-meta">${metaHtml}<span class="hm-total">${fmtTime(p.created_ts).slice(0,5)}</span></div>
          <div class="chevron">▸</div>
        </div>
        <div class="history-body">
          ${formatContent(p.content)}
          ${hasResult?`<div class="history-result">${formatContent(p.result_text)}</div>`:""}
        </div>
      </div>`;
    }).join("");
  }catch(e){
    box.innerHTML=`<div class="empty">历史记录加载失败</div>`;
  }
}

function toggleHistory(hd){
  const body = hd.nextElementSibling;
  const chevron = hd.querySelector(".chevron");
  body.classList.toggle("open");
  chevron.textContent = body.classList.contains("open") ? "▾" : "▸";
}

// ── 命中率统计 ──
async function loadStats(){
  try{
    const d = await (await fetch("/history?per_page=100")).json();
    const items = d.items || [];
    let hits=0, total=0;
    items.forEach(p=>{
      if(p.result_text){
        const r = countResults(p.result_text);
        hits += r.hits;
        total += r.hits + r.miss;
      }
    });
    document.getElementById("sDay").textContent = `Day ${dayNum()}`;
    document.getElementById("sTotal").textContent = total || "--";
    document.getElementById("sRate").textContent = total ? Math.round(hits/total*100)+"%" : "--%";
  }catch(e){
    document.getElementById("sDay").textContent = `Day ${dayNum()}`;
  }
}

// ── 初始化 ──
loadConfig();
loadToday();
loadHistory();
loadStats();
</script>
</body>
</html>
